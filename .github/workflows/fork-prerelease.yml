# Builds a fork (pre)release from one exact commit: a Linux x86_64 tarball, its
# installer (install.sh + a double-click .desktop for Steam Deck) and a Windows x64
# zip, with one SHA256SUMS file, published as a GitHub prerelease.
# Release builds carry the anonymous fault reporter (Source/fault_report.cpp);
# Linux installs update themselves (Packaging/fork/linux/update.sh).
# No game data is ever packaged; players supply their own MPQs.
name: Fork prerelease

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full source commit to release
        required: true
      version:
        description: Fork version without v, e.g. 0.1.0
        required: true
      publish:
        description: Publish the prerelease (false = build and verify only)
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: fork-prerelease-${{ inputs.version }}
  cancel-in-progress: false

env:
  CMAKE_BUILD_PARALLEL_LEVEL: '2'
  VCPKG_MAX_CONCURRENCY: '2'

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0
      - name: Record source and install dependencies
        run: |
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "${{ inputs.revision }}"
          Packaging/nix/debian-host-prep.sh --no-gcc
          sudo apt-get install -y ninja-build
          sudo apt-get install -y gcc-14 g++-14
      - name: Build release
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          cmake -S. -Bbuild -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_TESTING=OFF -DDISCORD_INTEGRATION=OFF \
            -DDEVILUTIONX_SYSTEM_LIBSODIUM=OFF -DDEVILUTIONX_SYSTEM_BZIP2=OFF \
            -DDEVILUTIONX_FAULT_REPORTS=ON -DDIABLO_SPLITSCREEN_VERSION=${{ inputs.version }}
          cmake --build build --parallel 2
      - name: Package
        run: |
          set -euo pipefail
          # The archive is versioned, the folder inside is not, so launchers
          # (Warpzone) can point at diablo-splitscreen/diablo-splitscreen.sh.
          name=diablo-splitscreen-v${{ inputs.version }}-linux-x86_64
          dir=diablo-splitscreen
          # The AppImage bundles SDL2/SDL2_image and friends for systems (Steam
          # Deck) that lack them, plus devilutionx.mpq.
          Packaging/nix/AppImage.sh build
          mkdir -p "$dir"
          mv devilutionx.appimage "$dir/devilutionx.AppImage"
          chmod +x "$dir/devilutionx.AppImage"
          cp LICENSE.md docs/LOCAL-COOP.md Packaging/resources/LICENSE.CC-BY.txt Packaging/resources/LICENSE.OFL.txt "$dir/"
          # Used by install.sh after unpacking: Steam shortcut tool and menu/Steam icon.
          cp Packaging/fork/linux/steam-shortcut.py Packaging/resources/icon.png "$dir/"
          # Launcher (crash report, applies updates) and the updater it calls.
          sed "s/@VERSION@/v${{ inputs.version }}/" Packaging/fork/linux/diablo-splitscreen.sh > "$dir/diablo-splitscreen.sh"
          cp Packaging/fork/linux/update.sh "$dir/"
          chmod +x "$dir/diablo-splitscreen.sh" "$dir/update.sh"
          tar -czf "$name.tar.gz" "$dir"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          # The installer and its double-click starter fetch exactly this release.
          for f in install.sh Install-Diablo-Splitscreen.desktop; do
            sed "s/@TAG@/v${{ inputs.version }}/g" "Packaging/fork/linux/$f" > "$f"
            sha256sum "$f" > "$f.sha256"
          done
          "$dir/devilutionx.AppImage" --appimage-extract-and-run --version
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            diablo-splitscreen-v*-linux-x86_64.tar.gz*
            install.sh*
            Install-Diablo-Splitscreen.desktop*

  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: lukka/get-cmake@latest
      - uses: lukka/run-vcpkg@v11.6
        with:
          vcpkgGitCommitId: '40f3c709db80acf154ac4b17a1f83c564ebd022e'
      - name: Record source and configure release
        run: |
          git rev-parse HEAD
          if ((git rev-parse HEAD) -ne '${{ inputs.revision }}') { throw 'wrong source' }
          Copy-Item Packaging/windows/CMakePresets.json CMakePresets.json
          # PowerShell splits an unquoted -DNAME=0.1.0 at the dot; quote every -D.
          cmake --preset ninja-vcpkg-relwithdebinfo "-DBUILD_TESTING=OFF" "-DDEVILUTIONX_FAULT_REPORTS=ON" "-DDIABLO_SPLITSCREEN_VERSION=${{ inputs.version }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build
        run: cmake --build --preset ninja-vcpkg-relwithdebinfo --parallel 2 --target devilutionx
      - name: Package
        run: |
          $zip = 'diablo-splitscreen-v${{ inputs.version }}-windows-x64'
          $name = 'diablo-splitscreen'
          $b = 'build-ninja-vcpkg-relwithdebinfo'
          New-Item -ItemType Directory -Force "$name/mods" | Out-Null
          Copy-Item "$b/devilutionx.exe" $name
          Copy-Item "$b/*.dll" $name
          # MSVC builds without smpq leave the game's own assets loose, not packed.
          if (Test-Path "$b/devilutionx.mpq") { Copy-Item "$b/devilutionx.mpq" $name } else { Copy-Item -Recurse "$b/assets" "$name/assets" }
          if (Test-Path "$b/mods") { Copy-Item -Recurse -Force "$b/mods/*" "$name/mods/" }
          Copy-Item LICENSE.md, docs/LOCAL-COOP.md, Packaging/resources/LICENSE.CC-BY.txt, Packaging/resources/LICENSE.OFL.txt $name
          Compress-Archive -Path $name -DestinationPath "$zip.zip"
          $hash = (Get-FileHash "$zip.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -NoNewline -Path "$zip.zip.sha256" -Value "$hash  $zip.zip`n"
          Get-ChildItem $name
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: diablo-splitscreen-v*-windows-x64.zip*

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision }}
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Verify checksums
        run: |
          set -euo pipefail
          cd dist
          for f in *.sha256; do sha256sum -c "$f"; done
          cat *.sha256 > SHA256SUMS
          ls -la
      - name: Install the Linux build with the release's own installer
        run: |
          set -euo pipefail
          grep -q 'END OF DIABLO SPLITSCREEN INSTALLER' dist/install.sh
          grep -q "releases/download/v${{ inputs.version }}/install.sh" dist/Install-Diablo-Splitscreen.desktop
          bash Packaging/fork/tests/test-linux-installer.sh dist ${{ inputs.version }}
      - name: Update an older install to this release
        run: bash Packaging/fork/tests/test-linux-update.sh dist ${{ inputs.version }}
      - name: Publish the prerelease
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          gh release create "v${{ inputs.version }}" --repo "$GITHUB_REPOSITORY" --prerelease \
            --target "${{ inputs.revision }}" --title "Diablo Splitscreen v${{ inputs.version }} (test build)" \
            --notes-file "../docs/release-notes/v${{ inputs.version }}.md" *.tar.gz *.zip install.sh Install-Diablo-Splitscreen.desktop SHA256SUMS
